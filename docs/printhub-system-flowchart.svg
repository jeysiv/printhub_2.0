<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:32px;font-weight:bold;fill:#172033}.sub{font-size:16px;fill:#596579}
      .lane{fill:#fff;stroke:#d8dfeb;stroke-width:2;rx:14}.lanehead{font-size:19px;font-weight:bold;fill:#365f91}
      .node{fill:#eaf2fb;stroke:#365f91;stroke-width:2;rx:10}.decision{fill:#fff4d8;stroke:#ba8b28;stroke-width:2}
      .action{fill:#e7f5ed;stroke:#34845a;stroke-width:2;rx:10}.end{fill:#365f91;stroke:#284d78;stroke-width:2}
      .label{font-size:15px;fill:#1d293b;text-anchor:middle}.endlabel{font-size:15px;font-weight:bold;fill:#fff;text-anchor:middle}
      .edge{fill:none;stroke:#52657e;stroke-width:2.2;marker-end:url(#arr)}.edge2{fill:none;stroke:#52657e;stroke-width:2.2}
      .yesno{font-size:13px;font-weight:bold;fill:#6b5523}.note{font-size:14px;fill:#465268}
    </style>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11 Z" fill="#52657e"/></marker>
  </defs>
  <rect width="1800" height="1320" fill="#f5f7fb"/>
  <text x="60" y="55" class="title">PrintHub — System Flowchart</text>
  <text x="60" y="84" class="sub">Customer order journey and administrator order processing (based on current PHP pages)</text>

  <!-- Swim lanes -->
  <rect x="40" y="110" width="1720" height="470" class="lane"/>
  <text x="65" y="145" class="lanehead">CUSTOMER / VISITOR</text>
  <rect x="40" y="600" width="1720" height="440" class="lane"/>
  <text x="65" y="635" class="lanehead">ORDER PROCESSING</text>
  <rect x="40" y="1060" width="1720" height="220" class="lane"/>
  <text x="65" y="1095" class="lanehead">ADMINISTRATOR</text>

  <!-- Main visitor/customer flow -->
  <ellipse cx="130" cy="245" rx="62" ry="32" class="end"/><text x="130" y="250" class="endlabel">START</text>
  <rect x="230" y="205" width="190" height="80" class="node"/><text x="325" y="237" class="label"><tspan x="325">Open Home</tspan><tspan x="325" dy="21">Browse services &amp; promos</tspan></text>
  <rect x="500" y="205" width="190" height="80" class="node"/><text x="595" y="237" class="label"><tspan x="595">Choose service</tspan><tspan x="595" dy="21">or select Order Now</tspan></text>
  <polygon points="800,190 890,245 800,300 710,245" class="decision"/><text x="800" y="241" class="label"><tspan x="800">Logged</tspan><tspan x="800" dy="19">in?</tspan></text>
  <rect x="950" y="150" width="190" height="80" class="node"/><text x="1045" y="183" class="label"><tspan x="1045">Login / Register</tspan><tspan x="1045" dy="21">Customer account</tspan></text>
  <polygon points="1245,135 1335,190 1245,245 1155,190" class="decision"/><text x="1245" y="186" class="label"><tspan x="1245">Credentials</tspan><tspan x="1245" dy="19">valid?</tspan></text>
  <rect x="1400" y="150" width="190" height="80" class="action"/><text x="1495" y="183" class="label"><tspan x="1495">Customer lands on</tspan><tspan x="1495" dy="21">order form</tspan></text>
  <rect x="950" y="345" width="190" height="80" class="node"/><text x="1045" y="377" class="label"><tspan x="1045">Show login error</tspan><tspan x="1045" dy="21">Try again</tspan></text>
  <polygon points="1245,330 1335,385 1245,440 1155,385" class="decision"/><text x="1245" y="381" class="label"><tspan x="1245">Account role</tspan><tspan x="1245" dy="19">is Customer?</tspan></text>
  <rect x="1400" y="330" width="190" height="80" class="action"/><text x="1495" y="363" class="label"><tspan x="1495">Select service, size,</tspan><tspan x="1495" dy="21">copies, optional promo</tspan></text>
  <rect x="1590" y="450" width="145" height="70" class="node"/><text x="1662" y="478" class="label"><tspan x="1662">Admin goes</tspan><tspan x="1662" dy="20">to dashboard</tspan></text>

  <!-- Arrows visitor -->
  <path d="M192 245 H230" class="edge"/><path d="M420 245 H500" class="edge"/><path d="M690 245 H710" class="edge"/>
  <path d="M890 245 H920 V190 H950" class="edge"/><text x="900" y="231" class="yesno">No</text>
  <path d="M800 190 V145 H1400" class="edge"/><text x="820" y="168" class="yesno">Yes</text>
  <path d="M1140 190 H1155" class="edge"/><path d="M1335 190 H1400" class="edge"/><text x="1360" y="177" class="yesno">Yes</text>
  <path d="M1245 245 V330" class="edge"/><text x="1258" y="290" class="yesno">No</text>
  <path d="M1155 385 H1140" class="edge"/><text x="1138" y="371" class="yesno">No / error</text>
  <path d="M1045 345 V290 H1045 V230" class="edge"/>
  <path d="M1335 385 H1400" class="edge"/><text x="1360" y="372" class="yesno">Yes</text>
  <path d="M1245 440 V485 H1590" class="edge"/><text x="1260" y="465" class="yesno">No (Admin)</text>
  <path d="M1495 230 V330" class="edge"/><path d="M1495 410 V600" class="edge"/>

  <!-- Order processing -->
  <rect x="1320" y="665" width="220" height="80" class="node"/><text x="1430" y="697" class="label"><tspan x="1430">Submit order form</tspan><tspan x="1430" dy="21">with CSRF token</tspan></text>
  <polygon points="1190,655 1280,710 1190,765 1100,710" class="decision"/><text x="1190" y="706" class="label"><tspan x="1190">Input valid?</tspan><tspan x="1190" dy="19">service / size / copies</tspan></text>
  <rect x="900" y="670" width="175" height="80" class="node"/><text x="987" y="702" class="label"><tspan x="987">Show validation</tspan><tspan x="987" dy="21">errors; correct form</tspan></text>
  <polygon points="1030,825 1120,880 1030,935 940,880" class="decision"/><text x="1030" y="876" class="label"><tspan x="1030">File attached?</tspan></text>
  <rect x="1170" y="840" width="170" height="80" class="action"/><text x="1255" y="872" class="label"><tspan x="1255">Validate &amp; save</tspan><tspan x="1255" dy="21">uploaded file</tspan></text>
  <rect x="1410" y="840" width="200" height="80" class="action"/><text x="1510" y="872" class="label"><tspan x="1510">Save order + item</tspan><tspan x="1510" dy="21">in DB transaction</tspan></text>
  <rect x="1410" y="945" width="200" height="65" class="node"/><text x="1510" y="972" class="label"><tspan x="1510">On save failure:</tspan><tspan x="1510" dy="19">remove uploaded file</tspan></text>
  <ellipse cx="1690" cy="880" rx="68" ry="38" class="end"/><text x="1690" y="875" class="endlabel"><tspan x="1690">MY</tspan><tspan x="1690" dy="19">ORDERS</tspan></text>
  <rect x="1110" y="945" width="220" height="65" class="node"/><text x="1220" y="972" class="label"><tspan x="1220">Track status / view total</tspan><tspan x="1220" dy="19">Add item or cancel pending</tspan></text>

  <!-- Arrows order processing -->
  <path d="M1430 745 V790 H1190 V765" class="edge"/><path d="M1100 710 H1075" class="edge"/><text x="1080" y="695" class="yesno">No</text>
  <path d="M987 670 V610 H1495 V410" class="edge"/>
  <path d="M1190 765 V790 H1030 V825" class="edge"/><text x="1204" y="785" class="yesno">Yes</text>
  <path d="M1120 880 H1170" class="edge"/><text x="1135" y="867" class="yesno">Yes</text>
  <path d="M1030 825 V790 H1510 V840" class="edge"/><text x="1045" y="813" class="yesno">No file</text>
  <path d="M1340 880 H1410" class="edge"/>
  <path d="M1610 880 H1622" class="edge"/><path d="M1510 920 V945" class="edge"/>
  <path d="M1410 978 H1330" class="edge"/>
  <path d="M1690 918 V990 H1220 V1010" class="edge"/>

  <!-- Admin flow -->
  <rect x="170" y="1130" width="200" height="80" class="node"/><text x="270" y="1162" class="label"><tspan x="270">Admin signs in</tspan><tspan x="270" dy="21">role checked</tspan></text>
  <rect x="480" y="1130" width="220" height="80" class="action"/><text x="590" y="1162" class="label"><tspan x="590">View all orders, counts</tspan><tspan x="590" dy="21">and completed sales</tspan></text>
  <rect x="820" y="1130" width="220" height="80" class="action"/><text x="930" y="1162" class="label"><tspan x="930">Update order status</tspan><tspan x="930" dy="21">pending → completed etc.</tspan></text>
  <polygon points="1190,1115 1280,1170 1190,1225 1100,1170" class="decision"/><text x="1190" y="1166" class="label"><tspan x="1190">Cancelled</tspan><tspan x="1190" dy="19">order?</tspan></text>
  <rect x="1370" y="1130" width="200" height="80" class="action"/><text x="1470" y="1162" class="label"><tspan x="1470">May delete cancelled</tspan><tspan x="1470" dy="21">order and uploaded files</tspan></text>
  <path d="M370 1170 H480" class="edge"/><path d="M700 1170 H820" class="edge"/><path d="M1040 1170 H1100" class="edge"/>
  <path d="M1280 1170 H1370" class="edge"/><text x="1310" y="1157" class="yesno">Yes</text>
  <path d="M1190 1225 V1250 H930 V1210" class="edge"/><text x="1204" y="1244" class="yesno">No</text>
  <text x="65" y="1260" class="note">Admin also manages the service catalog and promotions in the admin pages. Authentication is required; customers are redirected away from admin-only pages.</text>
</svg>
